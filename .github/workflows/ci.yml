name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly long-soak acceptance (ten-minute file soak, two-hour write
    # SLO, one-hour five-node mesh); see the live-soak job below.
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  test-linux:
    name: Test Linux amd64 (Go ${{ matrix.go-version }}, CGO=${{ matrix.cgo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26.x']
        cgo: ['0', '1']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history: release-upgrade checks out the previous release.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify dependencies
        run: go mod verify

      - name: Go vet
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          if [ "${{ matrix.cgo }}" = "0" ]; then
            go vet -tags "modernc" ./...
          else
            go vet -tags "sqlite_preupdate_hook sqlite_fts5" ./...
          fi

      - name: Run tests (pure Go modernc)
        if: matrix.cgo == '0'
        env:
          CGO_ENABLED: 0
        run: go test -tags "modernc" -v ./...

      - name: Run tests with race detector (CGO enabled, default mattn SQLite)
        if: matrix.cgo == '1'
        env:
          CGO_ENABLED: 1
        run: go test -tags "sqlite_preupdate_hook sqlite_fts5" -race -v ./...

      - name: Run mattn SQLite preupdate validation
        if: matrix.cgo == '1'
        env:
          CGO_ENABLED: 1
        run: go test -tags "sqlite_preupdate_hook sqlite_fts5" -run '^TestMattnSQLitePreUpdatePreservesTextAndBlobTypes|TestPreUpdateCaptureInsertUpdateDelete$' ./sqlengine

  live-gate:
    name: Live acceptance gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history: release-upgrade checks out the previous release.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Verify dependencies
        run: go mod verify

      - name: Build package
        env:
          CGO_ENABLED: 1
        run: go build -tags "sqlite_preupdate_hook sqlite_fts5" ./...

      - name: Run live release-gate scenarios
        env:
          CGO_ENABLED: 1
        run: bash tests-live/run.sh gate

      - name: Run pure-Go live matrix
        env:
          CGO_ENABLED: 0
          MURMUR_TAGS: modernc
        run: |
          bash tests-live/run.sh three-node-sync
          bash tests-live/run.sh rolling-restart
          bash tests-live/run.sh partition

      - name: Run race-instrumented live matrix
        env:
          CGO_ENABLED: 1
          MURMUR_RACE: '1'
        run: |
          bash tests-live/run.sh three-node-sync
          bash tests-live/run.sh rolling-restart
          bash tests-live/run.sh partition

      - name: Run privileged env-gated live suites
        # clock-skew needs libfaketime; impaired-network needs CAP_NET_ADMIN
        # for tc/netem on lo; diskfull-live needs a tmpfs mount. All three
        # skip with a message when the capability is absent, so this step
        # is what exercises them for real. Runs last so a stale mount or
        # qdisc cannot affect other steps; artifacts are chowned back for
        # the upload step below.
        env:
          CGO_ENABLED: 1
        run: |
          sudo apt-get update
          sudo apt-get install -y libfaketime iproute2
          bash tests-live/run.sh clock-skew
          sudo -E env "PATH=$PATH" "GOCACHE=$(mktemp -d)" bash tests-live/run.sh impaired-network
          sudo -E env "PATH=$PATH" "GOCACHE=$(mktemp -d)" bash tests-live/run.sh diskfull-live
          sudo chown -R "$(id -u):$(id -g)" tests-live/runtime tests-live/failures || true

      - name: Upload live failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-failures
          path: tests-live/failures/
          retention-days: 7

  live-soak:
    name: Live long-soak acceptance (scheduled)
    runs-on: ubuntu-latest
    timeout-minutes: 260
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Verify dependencies
        run: go mod verify

      - name: Run scheduled long soaks
        env:
          CGO_ENABLED: 1
        run: bash tests-live/run.sh soak

      - name: Upload live failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-soak-failures
          path: tests-live/failures/
          retention-days: 14

  live-stress:
    name: Live repetition stress (scheduled)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Verify dependencies
        run: go mod verify

      - name: Run scheduled repetition stress
        env:
          CGO_ENABLED: 1
        run: bash tests-live/run.sh stress

      - name: Upload live failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-stress-failures
          path: tests-live/failures/
          retention-days: 14

  scheduled-fuzz:
    name: Scheduled fuzzing and vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Fuzz codec decoders
        env:
          CGO_ENABLED: 1
        run: |
          for target in FuzzValue FuzzBatch FuzzSnapshotCells FuzzCellState; do
            go test ./codec -run '^$' -fuzz "^${target}$" -fuzztime=45s -parallel=2
          done

      - name: Fuzz replication protocol
        env:
          CGO_ENABLED: 1
        run: |
          for target in FuzzFrame FuzzHello FuzzBatchesMessage FuzzSnapshotChunkMessage; do
            go test ./replication -run '^$' -fuzz "^${target}$" -fuzztime=45s -parallel=2
          done

      - name: Scan Go dependencies for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Upload fuzz corpus on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: |
            codec/testdata/fuzz/
            replication/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14

  test-windows:
    name: Test Windows amd64 (Go ${{ matrix.go-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26.x']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history: release-upgrade checks out the previous release.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify dependencies
        run: go mod verify

      - name: Go vet
        run: go vet -tags "modernc" ./...

      - name: Run tests (Windows pure Go modernc)
        env:
          CGO_ENABLED: 0
        run: go test -tags "modernc" -v ./...

  cross-compile:
    name: Cross-Compilation Matrix (arm64/windows/linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Build Linux amd64 (Default mattn SQLite CGO)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1
        run: go build -tags "sqlite_preupdate_hook sqlite_fts5" ./...

      - name: Build Linux amd64 (Pure Go modernc)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -tags "modernc" ./...

      - name: Build Linux arm64 (Pure Go modernc)
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: go build -tags "modernc" ./...

      - name: Build Windows amd64 (Pure Go modernc)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -tags "modernc" ./...
