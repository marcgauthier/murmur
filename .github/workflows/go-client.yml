name: Go client
on:
  push:
    paths: ['go-client/**', 'src/**', 'replication/**', 'spool/**', 'Cargo.*', '.github/workflows/go-client.yml']
  pull_request:
    paths: ['go-client/**', 'src/**', 'replication/**', 'spool/**', 'Cargo.*', '.github/workflows/go-client.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux compiler dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev build-essential
      - name: Windows GNU tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=gcc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and test Go (Unix)
        if: runner.os != 'Windows'
        run: bash go-client/build.sh test -count=1 -timeout 180s ./...
      - name: Build and test Go (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./go-client/build.ps1 test -count=1 -timeout 180s ./...
      - name: Native ABI tests
        run: cargo test --locked --manifest-path go-client/native/Cargo.toml --target ${{ matrix.target }}
      - name: Go static analysis
        working-directory: go-client
        run: go vet ./...
      - name: Race detector
        if: runner.os != 'Windows'
        working-directory: go-client
        run: go test -race -count=1 -timeout 180s ./...
      - name: cgo pointer checks
        working-directory: go-client
        env:
          GOEXPERIMENT: cgocheck2
        run: go test -count=1 -timeout 180s ./...
      - name: Public API coverage audit
        shell: bash
        working-directory: go-client
        run: |
          mkdir -p build
          cargo run --locked --quiet --manifest-path native/Cargo.toml --example api_inventory > build/current-api.json
          go run ./internal/apiaudit -inventory build/current-api.json
