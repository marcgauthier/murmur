[package]
name = "murmur-live-hostile-peer"
version = "0.1.0"
edition = "2021"

[dependencies]
murmur-live-harness = { path = "../harness" }
# Raw-protocol attacker fixture only: drives QUIC (`quinn`, same version as
# the product), async IO timeouts (`tokio`), and the snapshot-bomb
# compressor (`zstd`, same version as the product).
tokio = { version = "1", features = ["rt", "time", "net"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
zstd = "0.13"
