[package]
name = "murmur-live-version-skew"
version = "0.1.0"
edition = "2021"

[dependencies]
murmur-live-harness = { path = "../harness" }
# Raw-protocol skewed-version fixture only: drives QUIC (`quinn`, same
# version as the product) and async IO timeouts (`tokio`).
tokio = { version = "1", features = ["rt", "time", "net"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
