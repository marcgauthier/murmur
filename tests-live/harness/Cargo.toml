[package]
name = "murmur-live-harness"
version = "0.1.0"
edition = "2021"

[dependencies]
sqlite-session = { path = "../..", features = ["replication"] }
murmur-replication = { path = "../../replication" }
spool = { package = "murmur-spool", path = "../../spool" }
rcgen = "=0.13.2"
tempfile = "3"
ipnet = "2"
rand = "0.8"
thiserror = "2"
libc = "0.2"
time = "0.3"

[[bin]]
name = "testnode"
path = "src/bin/testnode.rs"
