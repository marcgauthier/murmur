[package]
name = "murmur-live-downgrade-guard"
version = "0.1.0"
edition = "2021"

[dependencies]
murmur-live-harness = { path = "../harness" }
# Newer-store fixture only: re-encodes the spool `00/identity` record with a
# bumped format (`postcard` + `serde`, same versions as the product), reads
# back blocks the product wrote with its zstd block codec (`zstd`, same
# version as the product), and digests rows/files (`sha2`, same version as
# the product).
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
zstd = "0.13"
