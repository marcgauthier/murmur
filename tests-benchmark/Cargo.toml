[package]
name = "sqlite-session-benchmark"
version = "0.1.0"
edition = "2024"
default-run = "sqlite-session-benchmark"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled", "load_extension", "session"] }
sqlite-session = { path = "..", features = ["replication"] }
tempfile = "3"
rcgen = "=0.13.2"
