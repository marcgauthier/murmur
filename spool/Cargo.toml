[package]
name = "murmur-spool"
version = "0.1.0"
edition = "2021"
description = "Embedded persistence engine: fast concurrent writes journaled to sealed segments (Rust port of murmur/spool, byte-compatible on disk)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/marcgauthier/murmur"
homepage = "https://github.com/marcgauthier/murmur/tree/main/spoolrust"
documentation = "https://docs.rs/murmur-spool"
authors = ["Marc Gauthier"]
keywords = ["database", "storage", "journal", "embedded", "encryption"]
categories = ["database"]

[lib]
name = "spool"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
argon2 = "0.5"
crc32c = "0.6"
flate2 = "1"
fs2 = "0.4"
rand = "0.8"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = false
