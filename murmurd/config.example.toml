# murmurd example configuration (config.toml).
#
# murmurd is the assembled Murmur-SQL database: the embedded engine
# with MySQL- and PostgreSQL-protocol frontends. Both frontends speak
# to the one SQLite engine, so only SQLite-expressible statements
# work; anything else is rejected with an explicit error.

[murmur]
# State lives here (pebble store + node.json identity).
data_dir = "/var/lib/murmurd"
# Optional fixed identity. Empty values load from (or are generated
# into) data_dir/node.json on first boot; a configured value that
# disagrees with the persisted one refuses to start.
node_id = ""
db_id = ""

[murmur.encryption]
key_id = "murmurd-key-1"
# Exactly one of key_hex / key_file. 16, 24, or 32 bytes hex.
# Prefer key_file (0600) in production; never commit a real key.
key_hex = ""
key_file = "/etc/murmurd/key.hex"

[mysql]
enable = true
addr = "127.0.0.1:3306"
database = "murmur"

[postgres]
enable = true
addr = "127.0.0.1:5432"
database = "murmur"

# Replication is off when addr is empty and no peers/bootstrap
# entries exist. Meshing requires the TLS files.
[replication]
addr = ""
ca_cert_file = ""
node_cert_file = ""
node_key_file = ""
bootstrap = []
allowed_networks = []

# Static peers (node IDs + replication addresses).
# [[replication.peers]]
# node_id = "3fa85f64-5717-4562-b3fc-2c963f66afa6"
# addrs = ["10.0.0.2:4401"]

# Replicated schema, from a plain schema.sql file (required). The
# file holds CREATE TABLE statements (see schema.example.sql): every
# table needs an `id` blob primary key, column types are the SQLite
# spellings of integer, real, text, blob. Relative paths resolve from
# this config file's directory. The file bootstraps a fresh data_dir,
# and on every boot tables/columns it declares but the live schema
# lacks migrate in; runtime CREATE TABLE works the same way.
# ([[schema.tables]] is embedded-only and rejected here.)
[schema]
file = "schema.sql"
